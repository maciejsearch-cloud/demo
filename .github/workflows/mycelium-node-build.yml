name: Mycelium AI – węzeł na PC (Windows / Linux / macOS)

# Buduje samodzielne pliki wykonywalne węzła z opublikowanego mycelium/node/mycelium-node.pyz (PyInstaller,
# PyTorch CPU wbudowany – bez instalacji Pythona), uruchamia każdy z nich (start + połączenie z grzybnią
# + lokalna strona stanu) i publikuje jako wydanie GitHub z sumami SHA-256 (mycelium/node/binaries.json).
on:
  push:
    branches: [main]
    paths: ["mycelium/node/mycelium-node.pyz"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: node-build
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, plat: windows, file: MyceliumNode.exe, base: MyceliumNode }
          # wariant z GPU przez DirectML (AMD/Intel/NVIDIA na Windows): torch-directml wymaga PyTorch 2.4.1
          - { os: windows-latest, plat: windows-directml, file: MyceliumNode-DirectML.exe, base: MyceliumNode-DirectML }
          - { os: ubuntu-22.04, plat: linux, file: MyceliumNode-linux-x64, base: MyceliumNode-linux-x64 }
          - { os: macos-14, plat: macos, file: MyceliumNode-macos-arm64, base: MyceliumNode-macos-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: mycelium/node
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zależności (PyTorch CPU)
        shell: bash
        run: |
          if [ "${{ matrix.plat }}" = windows-directml ]; then python -m pip install -q torch==2.4.1 torch-directml; elif [ "${{ matrix.plat }}" = macos ]; then python -m pip install -q torch; else python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu; fi
          python -m pip install -q websockets pyinstaller sigstore psutil
      - name: Budowanie
        shell: bash
        run: |
          python -c "import zipfile; zipfile.ZipFile('mycelium/node/mycelium-node.pyz').extractall('build_src')"
          printf 'from iot_mycelium.mesh.node import main\n\nmain()\n' > entry.py
          extra=""; if [ "${{ matrix.plat }}" = windows-directml ]; then extra="--collect-all torch_directml"; fi
          pyinstaller --onefile $extra --noconfirm --name "${{ matrix.base }}" --paths build_src --collect-submodules iot_mycelium --collect-all sigstore --collect-all sigstore_protobuf_specs --collect-all tuf --collect-data certifi --exclude-module tkinter entry.py
          ls -la dist
      - name: Test startu (model, połączenie z grzybnią, strona stanu)
        shell: bash
        env:
          MYC_NO_PRESENCE: "1"
          PYTHONUTF8: "1"
        run: |
          python - "dist/${{ matrix.file }}" "${{ matrix.plat }}" <<'PY'
          import json, subprocess, sys, time, urllib.request
          exe, plat = sys.argv[1], sys.argv[2]
          h = subprocess.run([exe, "--help"], capture_output=True, text=True, encoding="utf-8", errors="replace", timeout=300)
          assert h.returncode == 0 and "--join" in h.stdout, h.stdout + h.stderr
          if "--selfupdate-selftest" in open("build_src/iot_mycelium/mesh/node.py", encoding="utf-8").read():
              st = subprocess.run([exe, "--selfupdate-selftest"], capture_output=True, text=True, timeout=300)
              assert st.returncode == 0, "brak biblioteki sigstore w binarium: " + st.stdout + st.stderr
          p = subprocess.Popen([exe, "--join", "--name", f"ci-{plat}", "--threads", "2", "--no-lm", "--status-port", "8765"])
          t0, st = time.time(), None
          try:
              while time.time() - t0 < 1500:
                  time.sleep(10)
                  assert p.poll() is None, f"węzeł zakończył się kodem {p.returncode}"
                  try:
                      st = json.loads(urllib.request.urlopen("http://127.0.0.1:8765/status.json", timeout=5).read())
                  except OSError:
                      continue
                  if st.get("connected"):
                      break
              assert st and st.get("connected"), f"brak połączenia: {st}"
              print("OK", json.dumps({k: st.get(k) for k in ("connected", "peers", "nodes_online", "backend", "label")}))
              smoke = {"plat": plat, "ok": True, "s": round(time.time() - t0), "nodes_online": st.get("nodes_online")}
          finally:
              p.terminate()
              try:
                  p.wait(30)
              except Exception:
                  p.kill()
          if "--gpu-info" in open("build_src/iot_mycelium/mesh/node.py", encoding="utf-8").read():
              # karty z systemu (WMI na Windows) + w wariancie DirectML test CPU vs DirectML (na serwerze CI: WARP,
              # programowy DirectML – sprawdza działanie operacji i zgodność straty, nie prędkość prawdziwej karty)
              arg = "--gpu-bench" if plat == "windows-directml" else "--gpu-info"
              g = subprocess.run([exe, arg], capture_output=True, text=True, encoding="utf-8", errors="replace", timeout=2400)
              print(g.stdout[-6000:], g.stderr[-3000:])
              assert g.returncode == 0, "test GPU nie zadziałał"
              gi = json.loads(g.stdout)
              if plat == "windows-directml":
                  assert gi["caps"]["variant"] == "directml", "brak torch-directml w wariancie DirectML"
                  b = gi.get("bench") or {}
                  smoke["gpu"] = {"directml": gi["directml"], "adapter": b.get("adapter"), "cpu": b.get("cpu"), "gpu": b.get("gpu"), "ok": b.get("ok"), "reason": b.get("reason")}
          open("smoke.json", "w").write(json.dumps(smoke))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plat }}
          path: |
            dist/${{ matrix.file }}
            smoke.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # podpis Sigstore bez kluczy (tożsamość tego workflow)
      attestations: write  # poświadczenie pochodzenia GitHub (gh attestation verify)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - uses: sigstore/cosign-installer@v3
      - name: Pliki do podpisu
        run: |
          mkdir -p out
          cp art/windows/dist/MyceliumNode.exe art/windows-directml/dist/MyceliumNode-DirectML.exe art/linux/dist/MyceliumNode-linux-x64 art/macos/dist/MyceliumNode-macos-arm64 mycelium/node/mycelium-node.pyz out/
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/MyceliumNode.exe
            out/MyceliumNode-DirectML.exe
            out/MyceliumNode-linux-x64
            out/MyceliumNode-macos-arm64
            out/mycelium-node.pyz
      - name: Wydanie + sumy SHA-256 + podpis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="node-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          mkdir -p out
          cp art/windows/dist/MyceliumNode.exe art/windows-directml/dist/MyceliumNode-DirectML.exe art/linux/dist/MyceliumNode-linux-x64 art/macos/dist/MyceliumNode-macos-arm64 out/
          cp mycelium/node/mycelium-node.pyz out/
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          cosign sign-blob --yes --new-bundle-format --bundle out/SHA256SUMS.txt.sigstore.json out/SHA256SUMS.txt
          gh release create "$tag" out/* --title "Mycelium AI – węzeł na PC ($tag)" --latest \
            --notes "Węzeł grzybni Mycelium AI (model językowy na CPU). Zbudowany z mycelium/node/mycelium-node.pyz w ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}; każdy plik uruchomiony w CI (połączenie z grzybnią). Weryfikacja: gh attestation verify PLIK -R ${GITHUB_REPOSITORY} albo cosign verify-blob --bundle SHA256SUMS.txt.sigstore.json --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/mycelium-node-build.yml@' --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS.txt, potem sha256sum -c SHA256SUMS.txt. Brak certyfikatu wydawcy Windows/Apple (SmartScreen/Gatekeeper ostrzeże)."
          python3 - "$tag" <<'PY'
          import hashlib, json, os, sys, glob
          tag = sys.argv[1]
          repo = os.environ["GITHUB_REPOSITORY"]
          plat = {"MyceliumNode.exe": "windows", "MyceliumNode-DirectML.exe": "windows-directml", "MyceliumNode-linux-x64": "linux", "MyceliumNode-macos-arm64": "macos"}
          rel = f"https://github.com/{repo}/releases/download/{tag}"
          files = []
          for n, o in plat.items():
              b = open(f"out/{n}", "rb").read()
              files.append({"os": o, "name": n, "url": f"https://github.com/{repo}/releases/download/{tag}/{n}", "sha256": hashlib.sha256(b).hexdigest(), "bytes": len(b)})
          smoke, smoke_gpu = {}, {}
          for f in glob.glob("art/*/smoke.json"):
              s = json.load(open(f)); smoke[s["plat"]] = f"ok ({s['s']} s)"
              if s.get("gpu"):
                  smoke_gpu[s["plat"]] = s["gpu"]
          pyz = hashlib.sha256(open("mycelium/node/mycelium-node.pyz", "rb").read()).hexdigest()
          from datetime import datetime, timezone
          json.dump({"tag": tag, "built": datetime.now(timezone.utc).isoformat(), "run_url": f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                     "pyz_sha256": pyz, "files": files, "smoke": smoke, "smoke_gpu": smoke_gpu,
                     "sums_url": f"{rel}/SHA256SUMS.txt", "sig_url": f"{rel}/SHA256SUMS.txt.sigstore.json",
                     "workflow": f"https://github.com/{repo}/.github/workflows/mycelium-node-build.yml"}, open("mycelium/node/binaries.json", "w"), indent=1)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mycelium/node/binaries.json
          git commit -m "Mycelium AI: węzeł na PC $tag (sumy SHA-256)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

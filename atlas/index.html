<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050b1c" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="AtlasOfWhen – interaktywna kula ziemska zdarzeń z otwartych danych: historia, katastrofy, wypadki, protesty, głośne sprawy i przestępczość." />
  <title>AtlasOfWhen – kula ziemska zdarzeń</title>
  <link rel="preconnect" href="https://tiles.maps.eox.at" crossorigin />
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
  <script type="module" crossorigin src="/demo/atlas/assets/index-CuxxF6B-.js"></script>
  <link rel="stylesheet" crossorigin href="/demo/atlas/assets/index-BozuRJW1.css">
</head>
<body>
  <a class="skip" href="#panel">Przejdź do panelu / Skip to panel</a>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div id="map" role="region" aria-label="Globe / Kula ziemska"></div>

  <aside id="panel" class="glass" aria-label="AtlasOfWhen">
    <button id="sheet" class="sheet" aria-expanded="false" aria-controls="panel-body"><span></span><b data-i18n="menu"></b></button>
    <header class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div><h1>AtlasOfWhen</h1><small class="muted">beta · open data</small></div>
      <div class="lang" role="group" aria-label="Language"><button data-lang="pl">PL</button><button data-lang="en">EN</button></div>
    </header>
    <div id="panel-body">
      <div class="search" role="combobox" aria-haspopup="listbox" aria-owns="qres">
        <input id="q" type="search" autocomplete="off" />
        <ul id="qres" role="listbox"></ul>
      </div>
      <nav id="crumbs" aria-label="breadcrumb"></nav>
      <p class="muted small" data-i18n="click"></p>
      <div id="stats" aria-live="polite"></div>
      <fieldset id="cats"><legend class="sr" data-i18n="category"></legend></fieldset>
      <details class="block" open><summary data-i18n="layers"></summary><div id="layers"></div></details>
      <ol id="list"></ol>
      <details class="block"><summary data-i18n="sources"></summary><div id="attr" class="attr"></div></details>
      <p class="small"><a id="placesLink" href="places/pl/" data-i18n="places"></a></p>
    </div>
  </aside>

  <footer id="timeline" class="glass" aria-label="Timeline">
    <button id="play" class="play" aria-label="Play">▶</button>
    <div class="track">
      <div class="labels"><b id="yr0"></b><b id="yr1"></b></div>
      <div class="hist-wrap">
        <canvas id="hist" aria-hidden="true"></canvas>
        <div id="cursor" class="cursor" hidden></div>
        <input id="y0" type="range" min="0" max="1000" step="1" aria-label="Od / From" />
        <input id="y1" type="range" min="0" max="1000" step="1" aria-label="Do / To" />
      </div>
    </div>
    <label class="speed"><span class="sr" data-i18n="speed"></span>
      <select id="speed" aria-label="Speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
    </label>
  </footer>

  <div id="loader"><div class="orb"></div><p id="loadmsg"></p></div>
</body>
</html>
